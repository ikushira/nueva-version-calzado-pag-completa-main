<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Final - Carrito</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      background: #f5f5f5; 
      margin: 0; 
      padding: 20px; 
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      background: #ff0000;
      color: white;
      padding: 15px;
      font-weight: bold;
      font-size: 18px;
    }
    .content {
      padding: 15px;
    }
    h2 {
      color: #333;
      border-bottom: 2px solid #ff0000;
      padding-bottom: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: #ff0000; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-warning { background: #ffc107; color: #333; }
    .btn-danger { background: #dc3545; color: white; }
    .btn:hover { opacity: 0.9; }
    
    #resultado {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    .cart-preview {
      margin: 15px 0;
      border: 2px solid #ddd;
      border-radius: 6px;
      padding: 10px;
    }
    
    /* Simular estilos del carrito real */
    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-bottom: 1px solid #e0e0e0;
    }
    .cart-item-img {
      width: 70px;
      height: 70px;
      min-width: 70px;
      min-height: 70px;
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }
    .cart-item-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .cart-item-info {
      flex: 1;
    }
    .cart-item-name {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin: 0 0 4px 0;
    }
    .cart-item-size {
      font-size: 12px;
      color: #666;
      margin: 0 0 4px 0;
    }
    .cart-item-price {
      font-size: 13px;
      font-weight: 700;
      color: #ff0000;
      margin: 0;
    }
    .success { color: #28a745; }
    .error { color: #dc3545; }
    .warning { color: #ffc107; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">🧪 Test Final - Carrito de Compras</div>
    
    <div class="content">
      <h2>1. Diagnóstico</h2>
      <button class="btn btn-primary" onclick="verLocalStorage()">📦 Ver localStorage</button>
      <button class="btn btn-warning" onclick="limpiarCarrito()">🗑️ Limpiar carrito</button>
      
      <h2>2. Agregar Producto de Prueba</h2>
      <button class="btn btn-success" onclick="agregarProductoPrueba()">➕ Agregar "Zapato Nike"</button>
      
      <h2>3. Vista Previa del Carrito</h2>
      <div class="cart-preview" id="cart-preview">
        <p style="color: #666; text-align: center;">Haz clic en "Ver localStorage" para ver el contenido</p>
      </div>
      
      <h2>4. Resultado</h2>
      <div id="resultado">Esperando acción...</div>
    </div>
  </div>
  
  <script>
    const STORAGE_KEY = 'mundo_calzado_cart';
    const PLACEHOLDER = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23eee%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2212%22 fill=%22%23999%22%3EImagen%3C/text%3E%3C/svg%3E';
    
    function log(msg) {
      document.getElementById('resultado').textContent += msg + '\n';
    }
    
    function clearLog() {
      document.getElementById('resultado').textContent = '';
    }
    
    function verLocalStorage() {
      clearLog();
      const data = localStorage.getItem(STORAGE_KEY);
      
      if (!data) {
        log('❌ No hay datos en localStorage');
        log('   Clave: ' + STORAGE_KEY);
        renderCartPreview([]);
        return;
      }
      
      try {
        const cart = JSON.parse(data);
        log('✅ Datos encontrados: ' + cart.length + ' productos\n');
        
        cart.forEach((item, i) => {
          log(`--- Producto ${i + 1} ---`);
          log(`  ID: ${item.id || '❌ FALTA'}`);
          log(`  Nombre: ${item.name || '❌ FALTA'}`);
          log(`  Precio: ${item.price || '❌ FALTA'}`);
          log(`  Talla: ${item.size || '❌ FALTA'}`);
          log(`  Cantidad: ${item.quantity || '❌ FALTA'}`);
          log(`  Imagen: ${item.image ? '✅ Presente' : '❌ FALTA'}`);
          if (item.image) {
            log(`    URL: ${item.image.substring(0, 50)}...`);
          }
          log('');
        });
        
        renderCartPreview(cart);
        
      } catch (e) {
        log('❌ Error al parsear: ' + e.message);
      }
    }
    
    function renderCartPreview(cart) {
      const container = document.getElementById('cart-preview');
      
      if (cart.length === 0) {
        container.innerHTML = '<p style="color: #666; text-align: center;">Carrito vacío</p>';
        return;
      }
      
      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-img">
            <img src="${item.image || PLACEHOLDER}" onerror="this.src='${PLACEHOLDER}'">
          </div>
          <div class="cart-item-info">
            <h4 class="cart-item-name">${item.name || 'Sin nombre'}</h4>
            <p class="cart-item-size">Talla: ${item.size || 'N/A'}</p>
            <p class="cart-item-price">$${(item.price || 0).toLocaleString('es-CO')}</p>
          </div>
        </div>
      `).join('');
    }
    
    function limpiarCarrito() {
      clearLog();
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem('mundoCalzadoCart');
      localStorage.removeItem('carrito');
      log('✅ Carrito limpiado completamente');
      log('');
      log('Ahora:');
      log('1. Ve a index.html');
      log('2. Agrega productos al carrito');
      log('3. Vuelve aquí y haz clic en "Ver localStorage"');
      renderCartPreview([]);
    }
    
    function agregarProductoPrueba() {
      clearLog();
      
      const producto = {
        id: 'test-' + Date.now(),
        name: 'Zapato Nike Air Max Test',
        price: 259900,
        image: PLACEHOLDER,
        size: '42',
        quantity: 1,
        category: 'Zapatos',
        brand: 'Nike'
      };
      
      let cart = [];
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          cart = JSON.parse(data);
        } catch (e) {}
      }
      
      cart.push(producto);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
      
      log('✅ Producto agregado correctamente');
      log('');
      log('Datos guardados:');
      log(JSON.stringify(producto, null, 2));
      log('');
      log('Ahora:');
      log('1. Ve a index.html');
      log('2. Abre el carrito');
      log('3. Debe aparecer "Zapato Nike Air Max Test"');
      
      renderCartPreview(cart);
    }
    
    // Cargar datos al iniciar
    verLocalStorage();
  </script>
</body>
</html>
