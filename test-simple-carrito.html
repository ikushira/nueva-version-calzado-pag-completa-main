<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple Carrito</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 40px; font-family: Arial; }
        .producto { border: 1px solid #ddd; padding: 20px; margin: 20px; max-width: 300px; }
        .talla-btn { padding: 10px 15px; margin: 5px; border: 1px solid #ddd; cursor: pointer; }
        .talla-btn.selected { background: #ff0000; color: white; }
        .btn-add-cart { padding: 12px 20px; background: #ff0000; color: white; border: none; cursor: pointer; }
        #carrito-info { background: #f0f0f0; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Test Simple del Carrito</h1>
    
    <div id="carrito-info">
        <p>Carrito cargado: <span id="status">Verificando...</span></p>
        <p>Función agregarAlCarrito: <span id="funcion-status">Verificando...</span></p>
        <p>Items en carrito: <span id="items-count">0</span></p>
        <button onclick="testAgregar()" style="padding: 10px; margin: 10px;">Test Agregar</button>
        <button onclick="verCarrito()" style="padding: 10px; margin: 10px;">Ver Carrito</button>
    </div>

    <div class="producto">
        <h3>Zapato Test</h3>
        <p>$75,000</p>
        <div>
            <button class="talla-btn" onclick="selectTalla(this, '38')">38</button>
            <button class="talla-btn" onclick="selectTalla(this, '39')">39</button>
            <button class="talla-btn" onclick="selectTalla(this, '40')">40</button>
        </div>
        <button class="btn-add-cart" onclick="agregarProducto()">Agregar al Carrito</button>
    </div>

    <script src="mypageshoes/js/carrito-completo.js"></script>
    <script>
        let tallaSeleccionada = null;

        function selectTalla(btn, talla) {
            document.querySelectorAll('.talla-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            tallaSeleccionada = talla;
            console.log('Talla seleccionada:', talla);
        }

        function agregarProducto() {
            console.log('=== Test Agregar Producto ===');
            console.log('Talla seleccionada:', tallaSeleccionada);
            console.log('Función disponible:', typeof window.agregarAlCarrito);
            
            if (!tallaSeleccionada) {
                alert('Selecciona una talla primero');
                return;
            }

            if (typeof window.agregarAlCarrito === 'function') {
                const resultado = window.agregarAlCarrito({
                    id: 'test-zapato',
                    nombre: 'Zapato Test',
                    precio: 75000,
                    imagen: './mypageshoes/assets/img/carrusel2/2.jpeg'
                }, tallaSeleccionada);
                console.log('Resultado:', resultado);
                actualizarInfo();
            } else {
                alert('Función agregarAlCarrito no disponible');
            }
        }

        function testAgregar() {
            if (!tallaSeleccionada) {
                alert('Selecciona una talla primero');
                return;
            }
            agregarProducto();
        }

        function verCarrito() {
            if (window.carritoCompleto) {
                const cart = window.carritoCompleto.getCart();
                console.log('Contenido del carrito:', cart);
                alert('Carrito tiene ' + cart.length + ' productos. Ver consola para detalles.');
            }
        }

        function actualizarInfo() {
            setTimeout(() => {
                document.getElementById('status').textContent = 
                    window.carritoCompleto ? 'OK ✓' : 'NO CARGADO ✗';
                document.getElementById('funcion-status').textContent = 
                    (typeof window.agregarAlCarrito === 'function') ? 'OK ✓' : 'NO DISPONIBLE ✗';
                
                if (window.carritoCompleto) {
                    const count = window.carritoCompleto.getTotalItems();
                    document.getElementById('items-count').textContent = count;
                }
            }, 100);
        }

        // Verificar cada segundo
        setInterval(actualizarInfo, 1000);
        
        // Verificación inicial
        setTimeout(() => {
            actualizarInfo();
            console.log('=== Estado del Sistema ===');
            console.log('window.carritoCompleto:', window.carritoCompleto);
            console.log('window.agregarAlCarrito:', typeof window.agregarAlCarrito);
        }, 500);
    </script>
</body>
</html>
