<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestiona tus Cambios - Mundo Calzado</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; line-height: 1.6; color: #333; }
    header { background: #ff0000; color: white; padding: 30px 20px; text-align: center; }
    main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h2 { color: #ff0000; margin-top: 30px; }
    .form-group { margin: 20px 0; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { 
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit;
    }
    .btn-submit { background: #ff0000; color: white; padding: 12px 30px; border: none; 
                  border-radius: 6px; font-size: 16px; cursor: pointer; }
    .btn-home { background: #666; color: white; padding: 12px 30px; text-decoration: none; 
                border-radius: 6px; display: inline-block; margin: 20px 10px 40px 0; }
    footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 60px; }
  </style>
</head>
<body>
  <header><h1>Gestiona tus Cambios</h1></header>
  <main>
    <h2>Solicitud de Cambio</h2>
    <p>Tienes 30 días desde la compra para solicitar cambios. El producto debe estar sin uso y con etiquetas.</p>
    
    <form id="formCambio" style="margin-top: 30px;">
      <div class="form-group">
        <label>Número de Pedido *</label>
        <input type="text" required placeholder="MC-XXXXXXXXXX">
      </div>
      <div class="form-group">
        <label>Email de Compra *</label>
        <input type="email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Motivo del Cambio *</label>
        <select required>
          <option value="">Selecciona...</option>
          <option>Talla incorrecta</option>
          <option>Color diferente al esperado</option>
          <option>Defecto de fábrica</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea rows="4" placeholder="Describe el motivo del cambio"></textarea>
      </div>
      <div class="form-group">
        <label>¿Prefieres cambio o devolución?</label>
        <select>
          <option>Cambio por otra talla</option>
          <option>Cambio por otro producto</option>
          <option>Devolución de dinero</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">Enviar Solicitud</button>
      <a href="../index.html" class="btn-home">Cancelar</a>
    </form>
    
    <script>
      document.getElementById('formCambio').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Solicitud enviada. Te contactaremos en 24-48 horas.');
        window.location.href = '../index.html';
      });
    </script>
  </main>
  <footer><p>&copy; 2025 Mundo Calzado</p></footer>
</body>
</html>
